[app]

# (str) Title of your application
title = SafeDrive Ultimate

# (str) Package name
package.name = safedriveultimate

# (str) Package domain (needed for android packaging)
package.domain = org.safedrive

# (list) Source files to include (let it empty to include all files)
source.include_exts = py,png,jpg,kv,atlas

# (list) List of inclusions using pattern matching
source.include_patterns = assets/*,images/*.png

# (list) Source files to exclude (let it empty to exclude none)
source.exclude_exts = spec

# (list) List of directory to exclude (let it empty to exclude none)
source.exclude_dirs = tests, bin, venv

# (list) List of exclusions using pattern matching
#source.exclude_patterns = license,images/*/*.jpg

# (str) Application versioning (method 1)
version = 1.0.0

# (list) Application requirements
# comma separated e.g. requirements = sqlite3,kivy
requirements = python3,kivy

# (list) Custom source folders for python modules
#source.custom_sources =

# (list) Permissions
#android.permissions = INTERNET

# (list) Features
#android.features = android.hardware.usb.host

# (str) Supported orientations (landscape, sensorLandscape, portrait or all)
orientation = portrait

# (list) List of service to declare
#services = NAME:gsid_to_call

#
# OSX Specific
#

#
# Number of CPU to use for compiling the application
#android.skip_cpus_count = 2

#
# Android specific
#

# (bool) Indicate if the application should be fullscreen or not
fullscreen = 0

# (string) Presplash background color (hex color code)
#presplash.color = #FFFFFF

# (string) Application icon, or path to the icon file
#icon.filename = %(source.dir)s/data/icon.png

# (list) Supported orientations
#orientation = portrait

# (list) List of packages to add to the application
#android.add_packages =

# (list) List of custom Java files to add to the android project (base is yours)
#android.add_src =

# (list) Gradle dependencies
#android.gradle_dependencies =

# (bool) Enable AndroidX support
android.androidx = True

# (list) The android archs to build for,, and arm64-v8a.
android.archs = arm64-v8a

# (int) Target Android API, should be as high as possible.
# (android.sdk satırı kaldırılmıştır, güncel Buildozer otomatik yönetir)

# (int) Minimum API your APK will support.
android.min_api = 21

# (str) Android NDK version to use
android.ndk = 25b

# (bool) Use --private data storage (True) or --dir public storage (False)
#android.private_storage = True

# (str) SSL certificate to use (optional)
#android.ssl_cert =

# (str) bootstrap to use for kivy
p4a.bootstrap = sdl2

# (str) extra command arguments to pass when building
#p4a.extra_args =
