name: Build Android APK Advanced

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clear Old Build Artifacts
      run: |
        rm -rf ~/.buildozer || true

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libstdc++6:i386 libreadline8:i386 \
            build-essential ccache libffi-dev libssl-dev patchelf coreutils wget

    - name: Install Python Build Tools
      run: |
        python3 -m pip install --upgrade pip
        pip install --user --upgrade Cython==0.29.33 buildozer

    - name: Build Android APK with Buildozer
      env:
        PATH: ${{ github.workspace }}/bin:/home/runner/.local/bin:/usr/bin:$PATH
      run: |
        ~/.local/bin/buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: safedrive-apk-release
        path: bin/*.apk
